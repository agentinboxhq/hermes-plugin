name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - name: Check out Hermes Agent, whose adapter base classes the plugin builds on
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
      - uses: astral-sh/setup-uv@v6
      # Hermes locks its dependencies for Python 3.14 only, with overrides a plain `pip install` of it can't resolve,
      # so it's installed from its own lock, which brings pytest with its dev tools.
      - name: Install Hermes from its lock
        working-directory: hermes-agent
        run: uv sync --frozen --python 3.14
      - name: Test
        working-directory: plugin
        run: ../hermes-agent/.venv/bin/python -m pytest -c tests/pytest.ini --rootdir=tests tests -q
        env:
          HERMES_AGENT_DIR: ${{ github.workspace }}/hermes-agent
          PYTHONPATH: tests
      - name: Validate the plugin as `hermes plugins install` does
        run: hermes-agent/.venv/bin/hermes plugins validate plugin
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
