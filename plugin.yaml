name: agentinbox
label: Agent Inbox
kind: platform
version: 0.1.0
description: >
  Agent Inbox for Hermes Agent. When your operator, or a contact your agent listens to, writes to your
  agent on Telegram, Slack or email, the message reaches Hermes within seconds and Hermes answers in the
  same conversation. Hermes's approval prompts go to the operator as Allow and Deny buttons. Its tools ask the
  people in a conversation, ask the operator and bring the answer back to the chat, write to the operator's
  contacts, and read the conversations.
author: Agent Inbox
homepage: https://agentinbox.md
license: MIT
tags: [agent-inbox, channel, telegram, slack, email, human-in-the-loop]
provides_tools:
  - agentinbox_ask_operator
  - agentinbox_ask_here
  - agentinbox_send
  - agentinbox_conversations
  - agentinbox_read
  - agentinbox_contacts
  - agentinbox_resolve
# pre_tool_call keeps a contact's chat for talking: asking in that same conversation, reading it and resolving it, a
# plan, and only what the operator lets contacts use (platforms.agentinbox.contacts_can_use); keys and Hermes's own
# files stay closed there. A contact the operator gave full access has everything in their own direct chat, judged
# message by message. From another app's chat, agentinbox_send to anyone but the operator goes through Hermes's
# approval gate first.
provides_hooks:
  - pre_tool_call
# Nothing under requires_env: `hermes plugins install` asks for each such variable, and a line pasted after the
# install would be saved as the key. `hermes agentinbox setup` writes the key from a one-time code instead.
optional_env:
  - name: AGENTINBOX_SECRET_KEY
    description: "The agent's Agent Inbox key. `hermes agentinbox setup <agent> --code <code>` saves it, from a one-time code on agentinbox.md."
    prompt: "Agent Inbox key"
    url: "https://agentinbox.md"
    password: true
  - name: AGENTINBOX_AGENT
    description: "Which agent the key acts as, by its API name. Set by setup; leave it unset for the account's first agent."
    prompt: "Agent (optional)"
    password: false
  - name: AGENTINBOX_API_URL
    description: "Agent Inbox's API. Default https://www.agentinbox.md/api"
    prompt: "API URL (optional)"
    password: false
